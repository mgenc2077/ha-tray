name: Build Release

on:
  push:
    tags: ["v*"]

  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release'
        required: true

permissions:
  contents: write

jobs:
  # Resolves the tag once — a manual run supplies it, a tag push infers it —
  # and fails fast if it does not exist, before three builds spend time on it.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - id: resolve
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -e
          case "$TAG" in
            "" | -* | *[!0-9A-Za-z._+/-]*)
              echo "refusing empty or unsafe tag: '$TAG'" >&2
              exit 1
              ;;
          esac
          if ! git ls-remote --exit-code --tags \
              "https://github.com/$GITHUB_REPOSITORY.git" "refs/tags/$TAG" >/dev/null; then
            echo "tag '$TAG' does not exist in $GITHUB_REPOSITORY" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build-linux:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            gcc libgl1-mesa-dev libwayland-dev libx11-dev \
            libxkbcommon-dev xorg-dev

      - name: Install Fyne CLI
        run: go install fyne.io/tools/cmd/fyne@latest

      - name: Build
        run: fyne package -os linux -icon Icon.png -release

      - name: Rename artifact
        run: mv *.tar.* ha-tray-linux-amd64.tar.gz

      - uses: actions/upload-artifact@v7
        with:
          name: ha-tray-linux-amd64
          path: ha-tray-linux-amd64.tar.gz

  build-windows:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install Fyne CLI
        run: go install fyne.io/tools/cmd/fyne@latest

      - name: Build
        run: fyne package -os windows -icon Icon.png -release

      - name: Rename artifact
        run: mv *.exe ha-tray.exe

      - uses: actions/upload-artifact@v7
        with:
          name: ha-tray-windows-amd64
          path: ha-tray.exe

  # ── Arch package .pkg.tar.zst (built on Arch against system libs) ──────────
  build-arch:
    needs: prepare
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel git go \
            libglvnd libx11 libxcursor libxi libxinerama libxrandr \
            libxxf86vm

      # pkgver only accepts [0-9A-Za-z._+] — notably no hyphens, so a tag like
      # v1.0-rc1 is rejected here rather than failing obscurely inside makepkg.
      - name: Stamp pkgver from tag
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -e
          pkgver="${TAG#v}"
          case "$pkgver" in
            "" | *[!0-9A-Za-z._+]*)
              echo "tag '$TAG' does not map to a valid pkgver: '$pkgver'" >&2
              exit 1
              ;;
          esac
          sed -i "s/^pkgver=.*/pkgver=$pkgver/" packaging/PKGBUILD

      # makepkg refuses to run as root; build as an unprivileged user.
      # It fetches the tagged source from GitHub (per packaging/PKGBUILD).
      - name: Build package
        run: |
          set -e
          useradd -m -s /bin/bash builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          su builder -c "cd \"$GITHUB_WORKSPACE/packaging\" && makepkg -f --noconfirm"

      - uses: actions/upload-artifact@v7
        with:
          name: ha-tray-arch-x86_64
          path: packaging/*.pkg.tar.zst
          if-no-files-found: error

  release:
    # No `if:` guard needed — the workflow only triggers on a tag push or a
    # manual run, and prepare has already rejected anything that is not a tag.
    needs: [prepare, build-linux, build-windows, build-arch]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          # Required on a manual run, where github.ref is a branch, not the tag.
          tag_name: ${{ needs.prepare.outputs.tag }}
          generate_release_notes: true
          files: |
            artifacts/ha-tray-linux-amd64/*
            artifacts/ha-tray-windows-amd64/*
            artifacts/ha-tray-arch-x86_64/*
